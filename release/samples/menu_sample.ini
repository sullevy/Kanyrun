; Kanyrun / quickmenu 风格示例
; 复制到 ~/.config/kanyrun/menu.ini 后按自己的习惯修改。
;
; 基本语法：
;   项目|命令                    普通菜单项
;   *项目|命令                   默认高亮项
;   -一级子菜单::id              一级子菜单，id 是稳定菜单 ID
;   --二级子菜单::id             二级子菜单
;   --                           分隔符
;   ; 文本                       注释
;
; 缩进规则：
;   子菜单里的项目必须缩进，4 个空格或 tab 都可以。
;   不缩进的项目属于默认 root 菜单，会在普通弹菜单时显示。
;
; 菜单 ID：
;   ::id                         普通菜单 ID，可被 config.toml 里的 menu = "id" 引用
;   ::@id                        上下文默认类菜单，内部 ID 仍是 id
;                                这类入口不会显示在默认 root 菜单里
;
; 上下文默认类：
;   -Selected text::@selectedtext 选中文本菜单
;   -File::@file                 单文件未命中后缀时的通用菜单
;   -Directory::@directory       单目录菜单
;   -Files::@file-list           多文件/多目录菜单
;   -Text file::@text-file|txt md rs
;                                带后缀过滤的文件菜单，只匹配这些扩展名
;
; --menu 强制弹菜单时的选择顺序：
;   多文件 -> file-list
;   目录   -> directory
;   文本   -> selectedtext
;   文件   -> 后缀命中的 ::@...|ext，再退回 file，再退回 root
;
; 常用内置动作：
;   @search:<provider>           使用 config.toml 里的搜索 provider
;   @copy-text                   复制当前文本
;   @copy-path                   复制当前文件路径
;   @open-file                   打开当前文件/目录
;   @open-directory              打开当前文件所在目录
;   @reveal-file                 在文件管理器中选中当前文件
;
; 常用占位符：
;   %s                           当前文本；URL 中会自动编码
;   %f                           当前文件路径；shell 命令中会作为单个参数安全传递
;   {text} {path} {directory}     显式文本、路径、目录占位符
;   %A_YYYY% %A_MM% %A_DD%        日期变量
;   %A_Hour% %A_Min% %A_Sec%      时间变量
;
; 命令推断：
;   https://...                  当 URL 打开
;   ~/... /... ./... ../...       当路径打开
;   其他内容                     当 shell 命令执行
;
; 单项专属环境变量可直接写在命令里：
;   WPS|env QT_IM_MODULE=fcitx GTK_IM_MODULE=fcitx XMODIFIERS=@im=fcitx wps %f

*Google|@search:google
GitHub search|@search:github
DuckDuckGo search|@search:duckduckgo
Copy text|@copy-text

-Selected text::@selectedtext
    *Google|@search:google
    DuckDuckGo|@search:duckduckgo
    Copy text|@copy-text
    Copy current time|sh -c 'echo -n "%A_YYYY%-%A_MM%-%A_DD% %A_Hour%:%A_Min%:%A_Sec%" | wl-copy'
    --Web::web
        MDN|https://developer.mozilla.org/search?q=%s
        Stack Overflow|https://stackoverflow.com/search?q=%s

-Text file::@text-file|txt md rs cpp h py ini toml json yaml yml
    *Kate|kate %f
    VS Code|code %f
    --Editors::editors|txt md rs
        Helix|hx %f
        Neovim|kitty -e nvim %f
    --
    Copy path|@copy-path

-Quick Paths::quick-paths
    Home|~/
    Projects|~/git
    Downloads|~/Downloads
    Today note|~/Documents/%A_YYYY%-%A_MM%-%A_DD%.md

-File::@file
    *Open|@open-file
    Show in folder|@reveal-file
    Copy path|@copy-path
    Open with WPS env|env QT_IM_MODULE=fcitx GTK_IM_MODULE=fcitx XMODIFIERS=@im=fcitx wps %f

-Directory::@directory
    *Open folder|@open-directory
    Copy path|@copy-path

-Files::@file-list
    *Open parent folder|@open-directory
    Copy first path|@copy-path

-PDF::@pdf|pdf
    *Open PDF|@open-file
    Show in folder|@reveal-file
    Copy path|@copy-path

-Image::@image|jpg jpeg png gif bmp webp svg tiff
    *Open image|@open-file
    qimgv|qimgv %f
    Show in folder|@reveal-file
    Copy path|@copy-path
