[package]
name = "kanyrun"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
mime_guess = "2"
urlencoding = "2"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
